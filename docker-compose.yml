services:
  backend:
    image: registry.tclemenceau.fr/mspr/tpre612:latest
    container_name: tpre612
    restart: unless-stopped
    env_file:
      - /opt/tpre612/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - grafana-net
    ports:
      - "8000:8000"
    volumes:
      - /opt/tpre612/data/output:/app/data/output
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-external-labels: "container=tpre612"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    image: registry.tclemenceau.fr/mspr/tpre532:latest
    container_name: tpre532-frontend
    restart: unless-stopped
    env_file:
      - /opt/tpre612/.env
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - grafana-net
    ports:
      - "3001:8501"
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-external-labels: "container=tpre532-frontend"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8501/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  grafana-net:
    external: true
    name: grafana_grafana-net
