# ══════════════════════════════════════════════════════════════════════════════
# .gitlab-ci.yml — TPRE612
# ══════════════════════════════════════════════════════════════════════════════

stages:
  - lint
  - test
  - build
  - deploy

# ── Variables globales ────────────────────────────────────────────────────────
variables:
  PYTHON_VERSION: "3.11"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  IMAGE_SHA: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  IMAGE_BRANCH: "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
  IMAGE_LATEST: "$CI_REGISTRY_IMAGE:latest"

cache:
  key: "$CI_COMMIT_REF_SLUG-uv"
  paths:
    - .cache/uv

.uv_setup: &uv_setup
  image: python:3.11-slim
  before_script:
    - pip install uv --quiet
    - uv sync --frozen --all-groups

.docker_login: &docker_login
  - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

# ── LINT ──────────────────────────────────────────────────────────────────────

lint:
  stage: lint
  <<: *uv_setup
  script:
    - uv run ruff check src/
    - uv run ruff format --check src/
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ── TEST ──────────────────────────────────────────────────────────────────────

test:
  stage: test
  <<: *uv_setup
  needs: []
  services:
    - name: postgres:15
      alias: postgres
  variables:
    POSTGRES_DB: "$CI_POSTGRES_DB"
    POSTGRES_USER: "$CI_POSTGRES_USER"
    POSTGRES_PASSWORD: "$CI_POSTGRES_PASSWORD"
    POSTGRES_HOST_AUTH_METHOD: "trust"
    DATABASE_URL: "postgresql://$CI_POSTGRES_USER:$CI_POSTGRES_PASSWORD@postgres:5432/$CI_POSTGRES_DB"
  script:
    - echo "waiting for postgres..."
    - |
      for i in $(seq 1 20); do
        python -c "
      import psycopg2, os, sys
      try:
          psycopg2.connect(os.environ['DATABASE_URL'])
          sys.exit(0)
      except:
          sys.exit(1)
      " && echo "postgres is up" && break || (echo "attempt $i/20, retrying..." && sleep 3)
      done
    - echo "running tests..."
    - uv run pytest src/ test/ --tb=short -q --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
    paths:
      - report.xml
    expire_in: 7 days
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always

# ── BUILD ─────────────────────────────────────────────────────────────────────

build:
  stage: build
  image: docker:24
  needs:
    - job: test
      optional: true
  before_script:
    - *docker_login
  script:
    - echo "building $IMAGE_SHA"
    - |
      docker build \
        --cache-from "$IMAGE_BRANCH" \
        --label "git.commit=$CI_COMMIT_SHA" \
        --label "git.branch=$CI_COMMIT_REF_NAME" \
        --label "build.job=$CI_JOB_ID" \
        -t "$IMAGE_SHA" \
        -t "$IMAGE_BRANCH" \
        .
    - echo "pushing $IMAGE_SHA"
    - docker push "$IMAGE_SHA"
    - echo "pushing $IMAGE_BRANCH"
    - docker push "$IMAGE_BRANCH"
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        echo "main branch detected, tagging as latest"
        docker tag "$IMAGE_SHA" "$IMAGE_LATEST"
        docker push "$IMAGE_LATEST"
      fi
  after_script:
    - docker image prune -f --filter "until=24h" || true
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ── DEPLOY STAGING ────────────────────────────────────────────────────────────

deploy_staging:
  stage: deploy
  image: docker:24
  needs:
    - job: build
      optional: true
  variables:
    GIT_STRATEGY: none
    CI_COMMIT_SHA: "$CI_COMMIT_SHA"
    CI_COMMIT_REF_NAME: "$CI_COMMIT_REF_NAME"
  before_script:
    - *docker_login
  script:
    - echo "deploying staging"
    - echo "branch  -> $CI_COMMIT_REF_NAME"
    - echo "commit  -> $CI_COMMIT_SHORT_SHA"
    - echo "image   -> $IMAGE_BRANCH"
    - echo "compose -> docker-compose.staging.yml"
    - echo "port    -> 8001"
    - cd /opt/tpre612
    - echo "pulling $IMAGE_BRANCH..."
    - docker compose -f docker-compose.staging.yml pull
    - echo "recreating staging container..."
    - docker compose -f docker-compose.staging.yml up -d --force-recreate
    - echo "waiting for healthcheck (max 150s)..."
    - |
      for i in $(seq 1 30); do
        STATUS=$(docker inspect \
          --format='{{.State.Health.Status}}' \
          tpre612-staging 2>/dev/null || echo "starting")

        echo "  attempt $i/30 -> $STATUS"

        if [ "$STATUS" = "healthy" ]; then
          echo "container is healthy"
          echo "staging available at http://$(hostname -I | awk '{print $1}'):8001/docs"
          exit 0
        fi

        if [ "$STATUS" = "unhealthy" ]; then
          echo "container is unhealthy, dumping logs"
          docker logs tpre612-staging --tail 50
          exit 1
        fi

        sleep 5
      done

      echo "timeout reached, container never became healthy"
      docker logs tpre612-staging --tail 50
      exit 1
  after_script:
    - docker image prune -f --filter "until=48h" || true
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  environment:
    name: staging
    url: "http://gitlab.tclemenceau.fr:8001"
    on_stop: stop_staging

# ── STOP STAGING ──────────────────────────────────────────────────────────────

stop_staging:
  stage: deploy
  image: docker:24
  variables:
    GIT_STRATEGY: none
  script:
    - echo "stopping staging..."
    - cd /opt/tpre612
    - docker compose -f docker-compose.staging.yml down
    - echo "staging stopped"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual
  environment:
    name: staging
    action: stop

# ── DEPLOY PRODUCTION ─────────────────────────────────────────────────────────

deploy_production:
  stage: deploy
  image: docker:24
  needs:
    - job: build
      optional: true
  variables:
    GIT_STRATEGY: none
  before_script:
    - *docker_login
  script:
    - echo "deploying production"
    - cd /opt/tpre612
    - docker compose pull
    - docker compose up -d --force-recreate
    - echo "waiting for healthcheck (max 150s)..."
    - |
      for i in $(seq 1 30); do
        STATUS=$(docker inspect \
          --format='{{.State.Health.Status}}' \
          tpre612 2>/dev/null || echo "starting")
        echo "  attempt $i/30 -> $STATUS"
        if [ "$STATUS" = "healthy" ]; then
          echo "production is healthy"
          exit 0
        fi
        if [ "$STATUS" = "unhealthy" ]; then
          echo "production is unhealthy, dumping logs"
          docker logs tpre612 --tail 50
          exit 1
        fi
        sleep 5
      done
      echo "timeout reached"
      docker logs tpre612 --tail 50
      exit 1
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  environment:
    name: production
    url: "http://gitlab.tclemenceau.fr:8000"
