services:
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: gitlab
    restart: always
    hostname: 'gitlab.tclemenceau.fr'
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://gitlab.tclemenceau.fr'
        registry_external_url 'https://registry.tclemenceau.fr'
        gitlab_rails['gitlab_shell_ssh_port'] = 2424

        gitlab_rails['smtp_enable'] = true
        gitlab_rails['smtp_address'] = "smtp.gmail.com"
        gitlab_rails['smtp_port'] = 587
        gitlab_rails['smtp_user_name'] = "thc437312@gmail.com"
        gitlab_rails['smtp_password'] = "uqim aivr arxe kdok"
        gitlab_rails['smtp_domain'] = "gmail.com"
        gitlab_rails['smtp_authentication'] = "login"
        gitlab_rails['smtp_enable_starttls_auto'] = true

        gitlab_rails['gitlab_email_from'] = "thc437312@gmail.com"
        gitlab_rails['gitlab_email_reply_to'] = "thc437312@gmail.com"

        registry_nginx['listen_port'] = 5050
        registry_nginx['listen_https'] = false
        registry_nginx['client_max_body_size'] = '0'
        letsencrypt['enable'] = false
        nginx['client_max_body_size'] = '0'
    ports:
      - '6980:80'
      - '6443:443'
      - '2424:22'
      - '5050:5050'
    volumes:
      - '$GITLAB_HOME/config:/etc/gitlab'
      - '$GITLAB_HOME/logs:/var/log/gitlab'
      - '$GITLAB_HOME/data:/var/opt/gitlab'
    shm_size: '256m'
  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    container_name: gitlab-runner
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gitlab-runner-config:/etc/gitlab-runner
    depends_on:
      - gitlab

volumes:
  gitlab-runner-config:
