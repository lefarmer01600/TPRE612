# docker-compose.staging.yml
# Environnement de staging — branche develop
# Port 8001 pour coexister avec la prod (8000)

services:
  backend:
    # Image taguée :develop, jamais :latest
    image: registry.tclemenceau.fr/mspr/tpre612:develop
    container_name: tpre612-staging
    restart: unless-stopped
    env_file:
      - /opt/tpre612/.env
    environment:
      # Surcharge pour identifier l'environnement dans les logs/API
      - ENVIRONMENT=staging
      - CI_COMMIT_SHA=${CI_COMMIT_SHA:-unknown}
      - CI_COMMIT_REF_NAME=${CI_COMMIT_REF_NAME:-develop}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - grafana-net
    ports:
      # 8001 → staging | 8000 → prod (pas de conflit)
      - "8001:8000"
    volumes:
      - /opt/tpre612/data/output:/app/data/output
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        # Label env=staging pour filtrer dans Grafana
        loki-external-labels: "container=tpre612-staging,env=staging"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  grafana-net:
    external: true
    name: grafana_grafana-net
